name: poll-upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/poll-upstream.yml"
      - "builder-ref.txt"
      - "manifest*.schema.json"

permissions:
  contents: write

concurrency:
  group: poll-upstream
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  poll:
    # Windows provides the same Authenticode verification as the desktop app.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v5

      - name: Read reviewed builder revision
        id: builder
        run: |
          $revision = (Get-Content -LiteralPath builder-ref.txt -Raw).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') { throw 'builder-ref.txt must identify an exact reviewed commit' }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Checkout the reviewed generator
        uses: actions/checkout@v5
        with:
          repository: xt0n1-t3ch/DLSSync
          path: .dlssync-src
          ref: ${{ steps.builder.outputs.revision }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compiler outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".dlssync-src -> target"
          shared-key: "manifest-builder-windows-v3"

      - name: Cache verified archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dlssync-manifest-cache
          key: dll-archives-${{ runner.os }}-${{ steps.builder.outputs.revision }}

      - name: Build and test generator
        working-directory: .dlssync-src
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test -p manifest-builder -p pe-version -p dll-catalog --lib --bins
          cargo build --release -p manifest-builder --locked

      - name: Generate both signed catalogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DLSSYNC_MANIFEST_SIGNING_KEY: ${{ secrets.DLSSYNC_MANIFEST_SIGNING_KEY }}
          RUST_LOG: info
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:DLSSYNC_MANIFEST_SIGNING_KEY)) { throw 'Catalog signing key is unavailable' }
          Copy-Item -LiteralPath manifest.json -Destination (Join-Path $env:RUNNER_TEMP 'manifest-before.json')
          & ./.dlssync-src/target/release/manifest-builder.exe --out manifest.json --out-v3 manifest-v3.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Validate both schemas, identities, signatures and delta
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm test
          npm run validate
          npm run semantic-diff -- (Join-Path $env:RUNNER_TEMP 'manifest-before.json') manifest.json
          npm run verify-signature

      - name: Commit accepted catalog bytes
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --quiet -- manifest.json manifest.json.sig manifest-v3.json manifest-v3.json.sig
          if ($LASTEXITCODE -eq 0) { Write-Output 'Catalogs are unchanged'; exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Cannot inspect catalog changes' }
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'dlssync-bot'
          git config user.email 'dlssync-bot@users.noreply.github.com'
          git add -- manifest.json manifest.json.sig manifest-v3.json manifest-v3.json.sig
          git commit -m 'chore(catalog): refresh verified runtime catalogs'
          git push
